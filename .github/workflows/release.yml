name: 'Release'

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  semantic-release:
    name: 'Release'
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    permissions:
      contents: read
      # required for npm trusted publishing (OIDC)
      id-token: write
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 'master'
          # the job token is read-only; releases and tags are created with the GH_TOKEN PAT from env
          persist-credentials: false
      - name: 'Setup Vite+'
        uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          node-version: 'lts'
          cache: true
      - name: 'Install dependencies'
        run: vp install --frozen-lockfile
      - name: 'Build'
        run: yarn build
      - name: 'Release'
        env:
          # PAT instead of GITHUB_TOKEN so the published release can trigger downstream workflows
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: vp exec semantic-release
